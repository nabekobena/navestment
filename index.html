<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Navestment</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Navestment">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* 並べ方：上に深緑＋金の帯（動いている数の輪）、下は3枚×5組（JRA・地方競馬・発信・投資とデータ・くらしと見張り）の札 */
:root{--bg:#f3f1ea;--card:#fffdf8;--ink:#1d2a24;--sub:#5f6b63;--line:#e3ded0;--head:#0f3d2e;--head2:#155240;--headink:#f6f1df;--gold:#c9982f;
--g:#1c9a62;--y:#c58a06;--r:#d1453b;--x:#9aa39c;--chipink:#ffffff;--keiba:#1c7a55;--chihou:#8a6a12;--hasshin:#b4552d;--toushi:#2b5fa8;--kurashi:#7a55a6;
--font:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--bg:#0e1512;--card:#17211c;--ink:#edf2ec;--sub:#a4b0a8;--line:#28362f;--head:#0b2a20;--head2:#103a2c;--headink:#f3ecd4;--gold:#e2b64e;
--g:#45d08f;--y:#f0b93a;--r:#ff7468;--x:#6d7a72;--chipink:#0e1512;--keiba:#4fc594;--chihou:#e0bd5a;--hasshin:#f08a5c;--toushi:#7fb0f5;--kurashi:#bb98e6;color-scheme:dark} }
:root[data-theme="dark"]{--bg:#0e1512;--card:#17211c;--ink:#edf2ec;--sub:#a4b0a8;--line:#28362f;--head:#0b2a20;--head2:#103a2c;--headink:#f3ecd4;--gold:#e2b64e;
--g:#45d08f;--y:#f0b93a;--r:#ff7468;--x:#6d7a72;--chipink:#0e1512;--keiba:#4fc594;--chihou:#e0bd5a;--hasshin:#f08a5c;--toushi:#7fb0f5;--kurashi:#bb98e6;color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--head)}
body{margin:0;min-height:100vh}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55}
.gut{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{background:linear-gradient(135deg,var(--head),var(--head2));color:var(--headink);border-bottom:4px solid var(--gold)}
.hero .gut{padding-block:20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{flex:0 0 auto;position:relative;width:108px;height:108px}.ring svg{width:108px;height:108px;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring .n b{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}.ring .n span{font-size:11px;opacity:.85}
.ttl{flex:1;min-width:0;flex-basis:220px}.ttl h1{margin:0;font-size:28px;letter-spacing:.04em;font-weight:800}.ttl h1 i{font-style:normal;color:var(--gold)}
.ttl p{margin:2px 0 10px;font-size:13px;opacity:.88}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.16);max-width:520px}
.bar i{display:block;height:100%}.bar .g{background:var(--g)}.bar .y{background:var(--y)}.bar .r{background:var(--r)}.bar .x{background:rgba(255,255,255,.28)}
.sum{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:8px;font-size:13px}.sum b{font-size:17px;margin-left:4px;font-variant-numeric:tabular-nums}
.sum .d{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.alert{background:var(--r);color:var(--chipink);font-weight:700;font-size:14px}.alert .gut{padding-block:9px}
.stale{background:var(--y);color:var(--chipink);font-weight:700;font-size:14px}.stale .gut{padding-block:9px}
main.gut{padding-block:6px 44px}
.grp{margin-top:20px}.grp h2{display:flex;align-items:center;gap:10px;font-size:16px;margin:0 0 10px;font-weight:800;flex-wrap:wrap}
.grp h2 .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--chipink)}
.grp h2 small{font-weight:400;color:var(--sub);font-size:12px}
.grp.jra .ic,.grp.jra .no{background:var(--keiba)}.grp.chihou .ic,.grp.chihou .no{background:var(--chihou)}.grp.hasshin .ic,.grp.hasshin .no{background:var(--hasshin)}.grp.toushi .ic,.grp.toushi .no{background:var(--toushi)}.grp.kurashi .ic,.grp.kurashi .no{background:var(--kurashi)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.c.r{border-color:var(--r)}
.top{display:flex;align-items:center;gap:9px}.no{color:var(--chipink);font-size:12px;font-weight:800;border-radius:7px;padding:1px 7px;font-variant-numeric:tabular-nums}
.nm{font-size:17px;font-weight:800;flex:1;min-width:0;overflow-wrap:anywhere}
.chip{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap;color:var(--chipink)}.c.g .chip{background:var(--g)}.c.y .chip{background:var(--y)}.c.r .chip{background:var(--r)}.c.x .chip{background:var(--x)}
.tag{font-size:11px;color:var(--sub)}.st{font-size:13px;overflow-wrap:anywhere}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:22px 16px;color:var(--sub);text-align:center;margin-top:20px}
.btn{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.foot{color:var(--sub);font-size:12px;margin-top:22px;display:flex;flex-direction:column;gap:10px}.foot .row{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head><body>

<header class="hero"><div class="gut">
  <div class="ring"><svg viewBox="0 0 108 108" aria-hidden="true"><circle cx="54" cy="54" r="46" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="10"/><circle id="arc" cx="54" cy="54" r="46" fill="none" stroke="var(--gold)" stroke-width="10" stroke-linecap="round" stroke-dasharray="0 289"/></svg><div class="n"><b id="n-run">–</b><span id="n-tot">動いている</span></div></div>
  <div class="ttl"><h1>Na<i>vest</i>ment</h1><p>ナベやんの投資アプリ　15個の状態（見るだけ）</p>
    <div class="bar" id="bar"></div>
    <div class="sum"><span><i class="d" style="background:var(--g)"></i>動いている<b id="s-g">–</b></span><span><i class="d" style="background:var(--y)"></i>待ち・試運転<b id="s-y">–</b></span><span><i class="d" style="background:var(--r)"></i>止まっている<b id="s-r">–</b></span><span><i class="d" style="background:rgba(255,255,255,.45)"></i>まだ<b id="s-x">–</b></span></div>
  </div>
</div></header>
<div class="alert" id="alert" hidden><div class="gut" id="alert-t"></div></div>
<div class="stale" id="stale" hidden><div class="gut" id="stale-t"></div></div>
<main class="gut">
  <div id="groups"><div class="empty" id="empty">読みこみ中…</div></div>
  <div class="foot"><div id="upd"></div>
    <div class="row"><button class="btn" id="reload" type="button">いま読み直す</button><a class="btn" href="https://claude.ai/artifact/1PyyoRYSXoJ1S8VzQNhRmb" target="_blank" rel="noopener">トレカ抽選ボードを開く</a></div>
    <div>この画面からは何も動かせません（見るだけ）。お金の額・口座番号は出しません。1分ごとに読み直します。</div></div>
</main>
<script>
(function(){
  var URL_='https://dl.dropboxusercontent.com/scl/fi/edpytjrj2agcpxcf27wta/status.json?rlkey=0rp1jqqgl710ow3de4awzg82d&dl=1';
  var ICON={chihou:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18c3-6 6-9 9-9s6 3 9 9"/><path d="M12 9V4"/><path d="M12 4l5 2-5 2"/></svg>',jra:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V7l5-3 4 3 3-1 4 5-3 2-3-1-2 3v5"/></svg>',
    hasshin:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4l9 4V6z"/><path d="M13 9c2 0 3 1.2 3 3s-1 3-3 3"/><path d="M18 6c2 1.5 3 3.5 3 6s-1 4.5-3 6"/></svg>',
    toushi:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 16l4-5 4 3 6-8"/><path d="M15 6h4v4"/></svg>',
    kurashi:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'};
  var GROUPS=[['jra','JRA','買う・オッズを残す・判定する',[1,3,5]],['chihou','地方競馬','買う・オッズを残す・判定する',[2,4,6]],['hasshin','発信','YouTube・note・動画',[8,9,10]],['toushi','投資とデータ','FX・CFD・netkeiba',[11,12,13]],['kurashi','くらしと見張り','日報・トレカ抽選・見張り番',[7,14,15]]];
  var WORD={g:'動いている',y:'待ち・試運転',r:'止まっている',x:'まだ'};
  var $=function(id){return document.getElementById(id)}, last=null;
  function el(t,c,x){var e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e;}
  function say(msg){ var g=$('groups'); g.textContent=''; g.appendChild(el('div','empty',msg)); }
  function hm(ts){ try{ return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(ts)); }catch(e){ return '—'; } }
  function render(S){
    var C=(S.cards||[]).filter(function(c){return Array.isArray(c)&&c.length>=5&&WORD[c[2]];}), n={g:0,y:0,r:0,x:0}, by={};
    C.forEach(function(c){ n[c[2]]++; by[c[0]]=c; });
    var tot=Math.max(1,C.length), circ=2*Math.PI*46;
    $('arc').setAttribute('stroke-dasharray',(circ*n.g/tot).toFixed(1)+' '+circ.toFixed(1));
    $('n-run').textContent=n.g; $('n-tot').textContent='／'+C.length+' 動いている';
    ['g','y','r','x'].forEach(function(k){ $('s-'+k).textContent=n[k]; });
    var bar=$('bar'); bar.textContent=''; ['g','y','r','x'].forEach(function(k){ var i=el('i',k); i.style.width=(100*n[k]/tot).toFixed(2)+'%'; bar.appendChild(i); });
    var red=C.filter(function(c){return c[2]==='r'});
    $('alert').hidden=!red.length; $('alert-t').textContent=red.length?'止まっている物があります：'+red.map(function(c){return ('0'+c[0]).slice(-2)+' '+c[1]}).join('・'):'';
    var age=(Date.now()-new Date(S.ts).getTime())/60000;
    $('stale').hidden=!(age>5); $('stale-t').textContent=age>5?'PC からの印が '+Math.round(age)+' 分前で止まっています（最後 '+hm(S.ts)+'）。PC が眠った・再起動した・通信が切れた、のどれかの見込みです。':'';
    var g=$('groups'); g.textContent='';
    GROUPS.forEach(function(G){
      var sec=el('section','grp '+G[0]), h=el('h2'), ic=el('span','ic'); ic.innerHTML=ICON[G[0]]; h.appendChild(ic); h.appendChild(document.createTextNode(G[1])); h.appendChild(el('small',null,G[2])); sec.appendChild(h);
      var grid=el('div','grid');
      G[3].forEach(function(no){ var c=by[no]; if(!c) return; var card=el('article','c '+c[2]), top=el('div','top');
        top.appendChild(el('span','no',('0'+c[0]).slice(-2))); top.appendChild(el('span','nm',String(c[1]))); top.appendChild(el('span','chip',WORD[c[2]]));
        card.appendChild(top); card.appendChild(el('div','tag',String(c[3]))); card.appendChild(el('div','st',String(c[4]))); grid.appendChild(card); });
      sec.appendChild(grid); g.appendChild(sec);
    });
    $('upd').textContent='PC が書いた時刻 '+hm(S.ts)+'　判定ソフト '+(S.nar_ver||'—')+'　PC が再起動しても自動で立ち上がる：'+(S.autostart?'入っています':'まだ');
  }
  function load(){
    fetch(URL_+'&t='+Date.now(),{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); })
    .then(function(S){ if(S&&S.cards){ last=S; render(S); } else if(!last){ say('状態のファイルは読めましたが、中身の形がちがいました。統括に知らせてください。'); } })
    .catch(function(){ if(!last){ say('いまは読めませんでした。電波を確かめて「いま読み直す」を押してください。'); } else { render(last); } });
  }
  $('reload').addEventListener('click',load);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) load(); });
  load(); setInterval(load,60000);
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
})();
</script>

</body></html>
