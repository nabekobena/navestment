<style>
/* 並べ方：上のタブで4つを切りかえ（予定／未出品／整備 自社／整備 外注）。予定は日付の半券つきの札、ほかは車ごとの札にチェックの列 */
:root{
  --bg:#f2f4f1; --card:#ffffff; --ink:#1a2420; --sub:#5d6b64; --line:#dde3de;
  --accent:#1f6f54; --accent-ink:#ffffff; --stub:#e8f1ec;
  --warn:#b96a00; --warn-bg:#fff3dc; --good:#157a4c; --good-bg:#e2f5ea; --mute-bg:#eceff0;
  --k-pick:#1f6f54; --k-pick-bg:#e3f2ea; --k-gen:#1d5fae; --k-gen-bg:#e2edfb; --k-riku:#7a4fb0; --k-riku-bg:#efe7fa; --k-arr:#8a5a1c; --k-arr-bg:#f6ecdb; --k-shk:#0f6f86; --k-shk-bg:#e0f1f5; --k-reg:#8a3f7a; --k-reg-bg:#f6e6f2; --bad:#b93434; --bad-bg:#fbe6e6;
  --font:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111613; --card:#1a211d; --ink:#eef3f0; --sub:#a3b0a9; --line:#2b352f;
  --accent:#6fd3a8; --accent-ink:#0e1512; --stub:#1f2c26;
  --warn:#ffbf5c; --warn-bg:#3a2c12; --good:#5fd69a; --good-bg:#15301f; --mute-bg:#232a27; --k-pick:#6fd3a8; --k-pick-bg:#17302a; --k-gen:#8fbcff; --k-gen-bg:#16263d; --k-riku:#c7a6f2; --k-riku-bg:#2a2140; --k-arr:#e3b877; --k-arr-bg:#33281a; --k-shk:#74cfe3; --k-shk-bg:#14303a; --k-reg:#e3a0d3; --k-reg-bg:#351d30; --bad:#ff8a8a; --bad-bg:#3a1a1a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111613; --card:#1a211d; --ink:#eef3f0; --sub:#a3b0a9; --line:#2b352f;
  --accent:#6fd3a8; --accent-ink:#0e1512; --stub:#1f2c26;
  --warn:#ffbf5c; --warn-bg:#3a2c12; --good:#5fd69a; --good-bg:#15301f; --mute-bg:#232a27; --k-pick:#6fd3a8; --k-pick-bg:#17302a; --k-gen:#8fbcff; --k-gen-bg:#16263d; --k-riku:#c7a6f2; --k-riku-bg:#2a2140; --k-arr:#e3b877; --k-arr-bg:#33281a; --k-shk:#74cfe3; --k-shk-bg:#14303a; --k-reg:#e3a0d3; --k-reg-bg:#351d30; --bad:#ff8a8a; --bad-bg:#3a1a1a; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:24px;font-weight:900;margin:0;letter-spacing:.02em}
h2{font-size:15px;font-weight:900;margin:10px 0 0;color:var(--sub);letter-spacing:.06em}
.lead{color:var(--sub);font-size:13px;margin:2px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--sub);font-weight:500;padding:0 8px;min-height:36px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:transparent;color:var(--sub);font:inherit;font-weight:700;font-size:13px;line-height:1.25;padding:7px 2px;min-height:48px;border-radius:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs b{font-variant-numeric:tabular-nums;font-size:16px;font-weight:900;color:var(--ink)}
.tabs button[aria-selected="true"] b{color:var(--accent-ink)}
.tabs b.zero{opacity:.45}
.list{display:flex;flex-direction:column;gap:10px}
.tk{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stub{background:var(--stub);border-bottom:1px dashed var(--line);padding:7px 12px;display:flex;flex-direction:row;align-items:baseline;gap:8px;flex-wrap:wrap}
.tk.nodate .stub{display:none}
.stub .d{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.stub .t{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2;order:-1}
.stub .w{font-size:14px;color:var(--sub);font-weight:700;margin-left:-4px}
.stub .left{margin-left:auto;font-size:13px;font-weight:900;border-radius:999px;padding:2px 10px;background:var(--card);color:var(--sub)}
.tk.today .stub{background:var(--warn-bg)} .tk.today .stub .left{background:var(--warn);color:var(--card)}
.tk.soon .stub .left{background:var(--warn-bg);color:var(--warn)}
.tk.done{background:var(--mute-bg)} .tk.done .stub{background:var(--mute-bg)} .tk.done .car,.tk.done .meta,.tk.done .stub .d,.tk.done .stub .t{color:var(--sub)} .tk.done .car{text-decoration:line-through}
.body{min-width:0;padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px}
.car{font-size:20px;font-weight:900;overflow-wrap:anywhere;line-height:1.3}
.car small{display:block;font-size:15px;color:var(--ink);font-weight:700;margin:2px 0 0;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.who{font-size:17px;font-weight:700;overflow-wrap:anywhere}.who small{font-size:13px;color:var(--sub);font-weight:500;margin-left:6px}
.kind{font-size:12px;font-weight:900;color:var(--kc,var(--accent));letter-spacing:.04em}
.kind b{display:inline-block;background:var(--kc,var(--accent));color:var(--card);border-radius:6px;padding:1px 8px;margin-right:6px;font-size:12px}
.tk.k-pick{--kc:var(--k-pick);--kb:var(--k-pick-bg)} .tk.k-gen{--kc:var(--k-gen);--kb:var(--k-gen-bg)} .tk.k-riku{--kc:var(--k-riku);--kb:var(--k-riku-bg)} .tk.k-arr{--kc:var(--k-arr);--kb:var(--k-arr-bg)} .tk.k-shk{--kc:var(--k-shk);--kb:var(--k-shk-bg)} .tk.k-reg{--kc:var(--k-reg);--kb:var(--k-reg-bg)}
.alert{font-size:15px;font-weight:900;background:var(--bad-bg);color:var(--bad);border:2px solid var(--bad);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.tk.warned{border-color:var(--bad)}
.tabs b.bad{color:var(--bad)}
.tk[class*="k-"]{border-left:6px solid var(--kc)} .tk[class*="k-"] .stub{background:var(--kb)}
.tk.today[class*="k-"] .stub{background:var(--warn-bg)} .tk.done[class*="k-"]{border-left-color:var(--line)} .tk.done[class*="k-"] .stub{background:var(--mute-bg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--sub);font-weight:700}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.meta{font-size:14px;color:var(--sub);overflow-wrap:anywhere}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--mute-bg);color:var(--sub)}
.pill.go{background:var(--good-bg);color:var(--good)} .pill.wait{background:var(--warn-bg);color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 14px;border:1px solid var(--line);border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;background:var(--card)}
.chk input{width:24px;height:24px;accent-color:var(--accent)}
.row .chk.main{flex:1 1 auto;justify-content:center;font-size:16px}
.row{margin-top:4px}
h2.day{font-size:16px;color:var(--ink);margin:8px 0 -2px;display:flex;align-items:baseline;gap:8px}h2.day small{font-size:13px;color:var(--sub);font-weight:700}
.chk.off{opacity:.5;cursor:default;text-decoration:line-through;background:transparent}
.chk.on{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.btn.on{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.fixbox{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.fixbox input{flex:1 1 200px;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
.fault{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:20px 16px;color:var(--sub);font-size:14px;text-align:center}
.note{font-size:12px;color:var(--sub)}
article.tk{cursor:pointer}.note1{cursor:pointer}
#notepop{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--card,#fff);color:inherit;border:2px solid var(--line,#999);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6;max-height:50vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#notepop small{display:block;margin-top:8px;font-size:12px;opacity:.7}
.ready{font-size:14px;font-weight:700;background:var(--good-bg);color:var(--good);border-radius:8px;padding:6px 10px}
.hand{font-size:14px;font-weight:700;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:6px 10px;overflow-wrap:anywhere}
.idgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:15px}.idgrid div{display:flex;flex-direction:column;min-width:0}.idgrid .k{font-size:12px;color:var(--sub);font-weight:700}.idgrid .v{font-weight:700;overflow-wrap:anywhere}.idgrid .v.miss{color:var(--warn)}
.kinds{display:flex;flex-wrap:wrap;gap:6px}.kinds button{font:inherit;font-size:14px;font-weight:700;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}.kinds button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.riku{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}.rk-h{font-weight:900}.rk-s{font-size:12px;color:var(--sub);font-weight:700}.rk-cos{display:flex;flex-wrap:wrap;gap:6px}.rk-q{display:flex;flex-direction:column;gap:8px}
.rk-f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub);font-weight:700}.rk-f input{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-width:0}.yen{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:15px}.yen input{flex:1 1 auto;width:100%}
details.donez{background:var(--mute-bg)}details.donez .list{padding:0 0 14px}
.car small.miss{color:var(--warn)}
.meta.miss{color:var(--warn);font-weight:700}
.idline{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:13px}.idline .k{color:var(--sub);font-size:11px;font-weight:700}.idline .v{font-weight:700}.idline .v.miss{color:var(--warn)}
.pills.inrow{display:inline-flex;flex-wrap:wrap;gap:4px}
.kind.inst{display:inline-flex;align-items:center;margin-right:2px}
.memo{font-size:16px;overflow-wrap:anywhere;white-space:pre-wrap}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 14px}
summary{cursor:pointer;font-weight:700;padding:12px 0;font-size:14px}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 0 14px}
form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub);font-weight:700;min-width:0}
form label.w{grid-column:1/-1}
form input,form select{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
form .btn{grid-column:1/-1}
.toast{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center;pointer-events:none}
.toast>div{background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:14px;max-width:100%}
@media (max-width:420px){ form{grid-template-columns:1fr} h1{font-size:20px} .lead{display:none} .wrap{gap:10px;padding-block:12px 96px} }
/* スマホで縦をつめる（社長 11/13 13:00） */
@media (max-width:560px){
  .list{gap:6px}
  .stub{padding:4px 10px;gap:6px}
  .stub .t{font-size:17px} .stub .d{font-size:14px} .stub .w{font-size:12px} .stub .left{font-size:12px;padding:1px 8px}
  .body{padding:6px 10px 8px;gap:3px}
  .car{font-size:16px;line-height:1.25}
  .car small{display:inline;font-size:12px;font-weight:700;margin:0 0 0 6px;color:var(--sub)}
.car small.shl2{display:block;margin:2px 0 0}
  .who{font-size:14px} .kind{font-size:11px} .kind b{font-size:11px;padding:0 6px}
  .meta{font-size:12px;line-height:1.4}
  .idgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 10px;font-size:13px} .idgrid .k{font-size:10px}
  .hand,.ready,.alert{font-size:12px;padding:4px 8px}
  .pills{gap:4px} .pill{font-size:11px;padding:1px 8px}
  .row{gap:6px;margin-top:2px}
  .chk{min-height:38px;padding:0 10px;font-size:13px} .chk input{width:20px;height:20px}
  .row .chk.main{font-size:14px}
  .btn{min-height:36px;padding:0 10px;font-size:13px} .btn.ghost{min-height:32px;padding:0 6px;font-size:12px}
  h2.day{font-size:14px;margin:4px 0 -2px}
  .kinds button{min-height:34px;font-size:13px;padding:0 10px}
  .kinds{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch} .kinds button{flex:0 0 auto}
  .legend{display:none}
  .meta.note1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .hand{padding:3px 8px}
  .row .chk.main{flex:0 0 auto;min-width:90px}
}
.sync{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0;font-size:13px;color:var(--sub)}
.car small.shl2{display:flex!important;flex-wrap:wrap;column-gap:12px;row-gap:0;margin:3px 0 0!important}.car small.shl2 .nw{white-space:nowrap}
.stub{flex-wrap:nowrap!important;min-width:0}.stub>.d,.stub>.w,.stub>.t,.stub>.left{flex:0 0 auto;white-space:nowrap}.stub>.kind.inst{flex:0 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block}.stub>.kind.inst b{display:inline-block}
.tk.shc .stub{display:none!important}.shtop .left{margin-left:auto;font-size:12px;font-weight:900;border-radius:999px;padding:1px 8px;background:var(--warn-bg);color:var(--warn)}
.v.kibou{color:#d32f2f!important;font-size:20px!important;font-weight:900!important}.kibourow{grid-column:1/-1}.kibourow .k{color:#d32f2f!important;font-weight:900}
.shtop{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:16px;margin:0 0 4px}.shtop b{font-weight:900}.shtop span{font-weight:700;font-variant-numeric:tabular-nums}
.car small.shl2{display:block}
</style>
<div class="wrap">
  <header>
    <div><h1>Staff Board</h1><p class="lead" id="lead">終わったらチェック。当日はグレーで残り、次の日に消えます。</p></div>
    <div class="row" style="margin:0"><button class="btn" id="fullbtn" type="button" hidden>全画面</button><button class="btn" id="reload" type="button">更新</button></div>
  </header>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-plan" aria-selected="true">引渡・来客<b id="n-plan">0</b></button>
    <button role="tab" id="tab-shaken" aria-selected="false">車検・登録<b id="n-shaken">0</b></button>
    <button role="tab" id="tab-docs" aria-selected="false">登録待ち<b id="n-docs">0</b></button>
    <button role="tab" id="tab-arr" aria-selected="false">入庫<b id="n-arr">0</b></button>
    <button role="tab" id="tab-stock" aria-selected="false">未出品<b id="n-stock">0</b></button>
    <button role="tab" id="tab-in" aria-selected="false">自社整備<b id="n-in">0</b></button>
    <button role="tab" id="tab-out" aria-selected="false">外注整備<b id="n-out">0</b></button>
    <button role="tab" id="tab-memo" aria-selected="false">メモ<b id="n-memo">0</b></button>
  </div>
  <div class="list" id="list"><div class="empty">読みこみ中…</div></div>
  <div class="sync" id="syncbox" hidden><button class="btn" id="syncbtn" type="button">状態ファイルから写す</button><span id="syncst">社長の画面だけに出ます。開いた時にも自動で写します（10分に1回まで）。</span></div>
  <details id="addbox">
    <summary id="addsum">＋ 足す</summary>
    <form id="addform">
      <label id="l-kind">種類<select id="f-kind"><option>引き取り</option><option>現車確認</option><option>陸送</option><option>納車</option><option>そのほか</option></select></label>
      <label id="l-skind" class="w">種類<select id="f-skind"><option>登録：予備検書き換え</option><option>登録：名義変更</option><option>車検：予備検査</option><option>車検：中古新規</option></select></label>
      <label id="l-zei">税止め<select id="f-zei"><option>あり</option><option>なし</option></select></label>
      <label id="l-uke">車検<select id="f-uke"><option>受ける</option><option>受けない</option></select></label>
      <label id="l-pl">ナンバー変更<select id="f-pl"><option>あり</option><option>なし</option></select></label>
      <label>車<input id="f-car" required maxlength="60" placeholder="例：アクティトラック"></label>
      <label>下3桁<input id="f-tail" maxlength="8" inputmode="numeric" placeholder="例：332"></label>
      <label id="l-who">だれ<input id="f-who" maxlength="40" placeholder="例：吉田様"></label>
      <label id="l-date">日<input id="f-date" type="date"></label>
      <label id="l-time">時間<input id="f-time" maxlength="20" placeholder="例：14:30／空なら「終日」"></label>
      <label class="w" id="l-hand">引き渡しの時の注意（もらうお金・払うお金など）<input id="f-hand" maxlength="200" placeholder="例：点検の基本料金を現金でもらう"></label>
      <label class="w" id="l-note">備考<input id="f-note" maxlength="200" placeholder="例：積載車で来る／オイル漏れ修理"></label>
      <button class="btn go" type="submit">足す</button>
    </form>
  </details>
  <p class="note" id="stamp"></p>
</div>
<div class="toast" id="toast" hidden><div id="toast-t"></div></div>
<script>
// Staff Board：ログインなし版のデータ係（Googleスプレッドシートを読む・書く）
(function(){

    ev.preventDefault(); if(!db||window.SBADDING) return; var base={car:$('f-car').value.trim(), tail:$('f-tail').value.trim(), note:$('f-note').value.trim(), done:false, src:'手入力', added_at:new Date().toISOString()}, coll;
    if(tab==='plan'){ coll='pickups'; base.how=$('f-kind').value; base.who=$('f-who').value.trim(); base.date=$('f-date').value||''; base.time=$('f-time').value.trim(); base.tags=[]; base.handover=$('f-hand').value.trim(); base.docs={}; }
    else if(tab==='arr'){ coll='arrivals'; base.from=$('f-who').value.trim(); base.date=$('f-date').value||''; }
    else if(tab==='shaken'){ coll='shaken'; base.how=$('f-skind').value; base.from=$('f-who').value.trim(); base.date=$('f-date').value||''; base.time=$('f-time').value.trim(); if(base.how==='登録：名義変更') base.opts={zeidome:$('f-zei').value==='あり',plate_change:$('f-pl').value==='あり'}; }
    else if(tab==='memo'){ coll='memos'; base={text:$('f-note').value.trim(), by:$('f-who').value.trim(), at:new Date().toISOString(), done:false}; if(!base.text) return; }
    else if(tab==='stock'){ coll='stock'; base.steps={no_shaken:$('f-uke').value==='受けない'}; } else { coll='maint'; base.kind=tab; base.steps={}; }
    window.SBADDING=true; var sbtn=$('addform').querySelector('button[type=submit],button:not([type])'); if(sbtn) sbtn.disabled=true;
    db.collection(coll).add(base).then(function(){ $('addform').reset(); $('addbox').open=false; }).catch(fail).then(function(){ window.SBADDING=false; if(sbtn) sbtn.disabled=false; });
  });
  // 登録・車検を足すときは、日にちに翌日を先に入れる
  $('addbox').addEventListener('toggle',function(){ if(!$('addbox').open||tab!=='shaken'||$('f-date').value) return; var t=new Date(Date.now()+9*3600e3+864e5); $('f-date').value=t.toISOString().slice(0,10); });
  // 連打で2回入らないように：0.8秒以内のくり返しの押しは無視する
  (function(){ var last=0, lastEl=null, lastKey=''; document.addEventListener('click',function(e){ var x=e.target.closest&&e.target.closest('button,label.chk,input[type=checkbox],summary'); if(!x) return; if(x.id==='fullbtn') return; var lb=x.closest('label'); if(lb) x=lb; var now=Date.now(); if(x===lastEl&&now-last<60) return; var ar=x.closest('article'), cr=ar&&ar.querySelector('.car'), key=(cr?cr.textContent:'')+'|'+(x.id||'')+'|'+x.textContent; if((key===lastKey&&now-last<800)||now-last<500){ e.preventDefault(); e.stopImmediatePropagation(); return; } last=now; lastEl=x; lastKey=key; },true); })();
  var timer=setTimeout(function(){ if(!ready){ ready=true; $('lead').textContent='一覧を読みこめませんでした。「更新」を押してください。'; render(); } },10000);

  // ---- V19：社長が開いた時だけ、Dropbox の状態ファイルから写す（Claude を通さない）。社員の画面では何もしない
  var SYNC_DIR='/YouTube_note共同成長/状態';
  function deep(o,f,out){ out=out||[]; if(o&&typeof o==='object'){ if(f(o)) out.push(o); for(var k in o){ if(Object.prototype.hasOwnProperty.call(o,k)) deep(o[k],f,out); } } return out; }
  function payloadOf(r){ if(!r) return null; if(r.payload!==undefined) return r.payload; if(r.structuredContent!==undefined) return r.structuredContent;
    var t=(r.content||[]).filter(function(c){return c.type==='text'}).map(function(c){return c.text}).join(''); try{ return JSON.parse(t); }catch(e){ return t; } }
  function kdate(s){ var m=/(\d{1,2})月(\d{1,2})日/.exec(s||''); if(!m) return ''; var n=new Date(), y=n.getFullYear(), mo=+m[1];
    if(mo<n.getMonth()+1-6) y++; return y+'-'+('0'+mo).slice(-2)+'-'+('0'+m[2]).slice(-2); }
  function newest(names,prefix){ var re=new RegExp('^'+prefix+'_状態_(\\d{8})_(\\d{4})'); var b=null,bk='';
    names.forEach(function(e){ var m=re.exec(e.name||''); if(m&&/\.json$/.test(e.name)){ var k=m[1]+m[2]+e.name; if(k>bk){ bk=k; b=e; } } }); return b; }
  function fetchNewest(mcp,ents,prefix){ var f=newest(ents,prefix); if(!f) return Promise.resolve(null);
    return mcp.callTool('Dropbox','fetch',{id:f.id||f.path||f.path_display}).then(function(r2){ var p=payloadOf(r2), txt=(p&&typeof p==='object'&&typeof p.text==='string')?p.text:(typeof p==='string'?p:'');
      try{ return JSON.parse(txt); }catch(e){ return null; } }).catch(function(){ return null; }); }
  // V20：同じ車を1台だけ見つける（下3桁が同じで、車の名前の頭3字が同じ。2台以上・0台なら写さない）
  function oneCar(list,x){ var t=String(x.tail||x.chassis_tail||'').replace(/[^0-9]/g,'').slice(-3), nm=norm(x.car||x.car_name||'').slice(0,3);
    var hit=list.filter(function(r){ return !r.hide && !r.done && String(r.tail||(r.chassis?String(r.chassis).slice(-3):''))===t && t && (!nm || norm(r.car).indexOf(nm)===0 || nm.indexOf(norm(r.car).slice(0,3))===0); });
    return hit.length===1?hit[0]:null; }
  function syncNow(mcp,why){
    var st=$('syncst'); if(st) st.textContent='写しています…';
    return mcp.callTool('Dropbox','list_folder',{path:SYNC_DIR}).then(function(r){
      var ents=deep(payloadOf(r),function(o){ return typeof o.name==='string' && (o.path_display||o.path||o.id); });
      return Promise.all([fetchNewest(mcp,ents,'kei'),fetchNewest(mcp,ents,'ju'),fetchNewest(mcp,ents,'yahoo'),fetchNewest(mcp,ents,'invoice')]);
    }).then(function(a){
      var kei=a[0], ju=a[1], ya=a[2], inv=a[3], jobs=[], c={made:0,moved:0,arr:0,jumin:0,plate:0}, miss=[];
      // 車検予約（kei）→ 車検・登録
      if(kei&&kei.ok===true&&Array.isArray(kei.reservations)) kei.reservations.forEach(function(x){ if(!x||!x.no) return; var id='kr-'+String(x.no).replace(/[^0-9]/g,''); if(id==='kr-') return;
          var d=kdate(x.day), tm=((x.round||'').replace('ラウンド','R'))+(x.uketsuke?' 受付 '+x.uketsuke.replace(/^0/,''):'');
          var cur=D.shaken.filter(function(r){return r.id===id})[0];
          if(!cur){ c.made++; jobs.push(db.doc('shaken/'+id).set({car:x.plate||'', tail:String(x.chassis||'').replace(/[^0-9]/g,'').slice(-3), chassis:x.chassis||'', how:'車検：'+(x.kind||'継続検査'), from:'', date:d, time:tm,
              note:(x.office||'')+'。予約番号 '+x.no+'（車検予約サイトから自動で写した）', done:false, src:'kei 自動', added_at:new Date().toISOString()})); }
          else if(!cur.done && !cur.hide && !cur.time_fixed && (cur.date!==d || cur.time!==tm)){ c.moved++; jobs.push(put('shaken',id,{date:d,time:tm})); } });
      else miss.push('車検予約');
      // 入庫予定（JU 仕入れ係）→ 入庫。新しい車だけ足す（人が付けた「到着した」は触らない）
      if(ju&&ju.ok===true&&Array.isArray(ju.arrivals)) ju.arrivals.forEach(function(x){ if(!x) return; var key=String(x.chassis||x.lot||x.tail||'').replace(/[^0-9A-Za-z]/g,''); if(!key) return; var id='ju-'+key;
          if(D.arrivals.some(function(r){return r.id===id})) return; c.arr++;
          jobs.push(db.doc('arrivals/'+id).set({car:x.car||x.car_name||'', tail:String(x.tail||x.chassis||'').replace(/[^0-9]/g,'').slice(-3), chassis:x.chassis||'', from:x.venue||x.from||'', date:x.date||x.eta||'', note:'仕入れ係の状態ファイルから自動で写した', done:false, src:'ju 自動', added_at:new Date().toISOString()})); });
      else miss.push('入庫予定');
      // 住民票（ヤフオク係の docs_arrived）→ 書類待ち。人がまだ付けていない（未設定の）時だけ true にする
      if(ya&&ya.ok===true&&Array.isArray(ya.deals)) ya.deals.forEach(function(x){ if(!x) return; var r=oneCar(D.pickups,x); if(!r) return; var dc=r.docs||{};
          if(typeof x.aid4==='string'&&/^[0-9A-Za-z]{4}$/.test(x.aid4)&&r.aid4!==x.aid4) jobs.push(put('pickups',r.id,{aid4:x.aid4}));
          var idp={}; ['real_name','city','yahoo_id'].forEach(function(k){ if(typeof x[k]==='string'&&x[k].trim()&&x[k].length<=40&&r[k]!==x[k].trim()) idp[k]=x[k].trim(); }); if(Object.keys(idp).length) jobs.push(put('pickups',r.id,idp));
          if(x.docs_arrived!==true) return;
          if(dc.juminhyo===undefined){ c.jumin++; var nd={juminhyo:true,plate:!!dc.plate}; jobs.push(put('pickups',r.id,{docs:{juminhyo:true},docs_at:(nd.juminhyo&&nd.plate)?new Date().toISOString():'',docs_src:'ヤフオク係'})); } });
      else miss.push('書類到着');
      // 新ナンバー着（請求書係の plate_arrived）→ 書類待ち。同じく未設定の時だけ
      if(inv&&inv.ok===true&&Array.isArray(inv.cars)) inv.cars.forEach(function(x){ if(!x||x.plate_arrived!==true) return; var r=oneCar(D.pickups,x); if(!r) return; var dc=r.docs||{};
          if(dc.plate===undefined){ c.plate++; var nd={juminhyo:!!dc.juminhyo,plate:true}; jobs.push(put('pickups',r.id,{docs:{plate:true},docs_at:(nd.juminhyo&&nd.plate)?new Date().toISOString():'',plate_src:'請求書係'})); } });
      else miss.push('ナンバー着');
      return Promise.all(jobs).then(function(){ return {c:c,miss:miss}; });
    }).then(function(o){ var c=o.c; if(st) st.textContent='写しました：車検 新しく'+c.made+'・日時の変更'+c.moved+'／入庫 '+c.arr+'／住民票 着 '+c.jumin+'／新ナンバー 着 '+c.plate+(o.miss.length?'（読めなかった：'+o.miss.join('・')+'）':''); try{localStorage.setItem('sb-sync',String(Date.now()))}catch(e){} })
      .catch(function(e){ if(st) st.textContent='写せませんでした：'+((e&&e.message)||(e&&e.code)||'わからない'); });
  }
  function startSync(){
    Promise.all([window.claude.use('user'),window.claude.use('mcp')]).then(function(a){
      var u=a[0], mcp=a[1]; if(!u||!mcp||!(u.isOwner&&u.isOwner())) return;           // 社長だけ
      var box=$('syncbox'); if(box) box.hidden=false;
      $('syncbtn').addEventListener('click',function(){ syncNow(mcp,'button'); });
      var last=0; try{ last=+localStorage.getItem('sb-sync')||0 }catch(e){}
      var wait=function(){ if(ready&&COLLS.every(function(x){return got[x]})){ if(Date.now()-last>10*60*1000) syncNow(mcp,'open'); } else setTimeout(wait,500); }; wait();
    }).catch(function(){});
  }
  function start(){
    if(!window.claude||!window.claude.use){ clearTimeout(timer); ready=true; $('lead').textContent='この画面は Claude の中で開くと使えます。'; render(); return; }
    window.claude.use('db').then(function(d){
      if(!d){ clearTimeout(timer); ready=true; $('lead').textContent='サインインすると一覧が出ます。'; $('addbox').hidden=true; render(); return; }
      db=d; var bad=function(){ clearTimeout(timer); ready=true; $('lead').textContent='一覧を読みこめませんでした。「更新」を押してください。'; render(); };
      COLLS.forEach(function(c){ db.collection(c).onSnapshot(function(s){ D[c]=s.docs.map(copy); got[c]=true; if(COLLS.every(function(x){return got[x]})){ ready=true; clearTimeout(timer); } render(); },bad); });
      db.doc('meta/info').get().then(function(x){ if(x.exists){ meta=x.data(); render(); } }).catch(function(){});
      startSync();
    });
  }
  render(); start();
})();
</script>
